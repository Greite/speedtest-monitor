name: update-deps

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: update-deps
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip if a failed update PR is still open
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label dependencies --json number --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A dependency update PR is still open, skipping run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: guard
    if: needs.guard.outputs.skip == 'false'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Set up Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update dependencies (semver ranges)
        run: bun update

      # bun update does not rewrite the ranges embedded in bun.lock; without
      # this resync the next run would see a phantom lockfile change and
      # publish a stray release
      - name: Resync lockfile after update
        run: bun install

      - name: Migrate Biome config
        run: bunx biome migrate --write

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain package.json bun.lock biome.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No updates available."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git author
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Lint (tsc + Biome)
        id: lint
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: bun run lint

      - name: Test
        id: test
        if: steps.changes.outputs.changed == 'true' && steps.lint.outcome == 'success'
        continue-on-error: true
        run: bun test

      - name: Build project
        id: build
        if: steps.changes.outputs.changed == 'true' && steps.lint.outcome == 'success' && steps.test.outcome == 'success'
        continue-on-error: true
        run: bun run build

      - name: Commit, tag, release and dispatch Docker build
        if: steps.changes.outputs.changed == 'true' && steps.lint.outcome == 'success' && steps.test.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          git add package.json bun.lock biome.json
          git commit -m "chore(deps): update all dependencies to latest"

          prev_tag=$(git describe --tags --abbrev=0)
          base=${prev_tag#v}
          if git log --no-merges --format=%s "$prev_tag"..HEAD | grep -qE '^(feat|style)[(:!]'; then
            next=$(echo "$base" | awk -F. '{printf "%d.%d.0", $1, $2 + 1}')
          else
            next=$(echo "$base" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          fi

          git tag "v$next"
          git push origin main
          git push origin "v$next"

          # Release notes follow the repo pattern: ## Features / ## Fixes /
          # ## Chores sections with "- **type(scope):** description" entries
          # and a Full Changelog compare link footer
          git log --no-merges --reverse --format=%s "$prev_tag"..HEAD | awk '
            {
              i = index($0, ": ")
              type = (i > 0) ? substr($0, 1, i - 1) : $0
              rest = (i > 0) ? substr($0, i + 2) : ""
              entry = "- **" type ":** " rest "\n"
              if (type ~ /^(feat|style)/) features = features entry
              else if (type ~ /^fix/) fixes = fixes entry
              else chores = chores entry
            }
            END {
              if (features != "") printf "## Features\n\n%s\n", features
              if (fixes != "") printf "## Fixes\n\n%s\n", fixes
              if (chores != "") printf "## Chores\n\n%s\n", chores
            }
          ' > /tmp/notes.md
          printf '**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$prev_tag" "$next" >> /tmp/notes.md

          gh release create "v$next" --title "v$next" --notes-file /tmp/notes.md

          gh workflow run docker-publish.yml --ref "v$next"

      - name: Open PR on failure
        if: steps.changes.outputs.changed == 'true' && (steps.lint.outcome == 'failure' || steps.test.outcome == 'failure' || steps.build.outcome == 'failure')
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          failed_step="lint"
          if [ "$LINT_OUTCOME" = "success" ]; then failed_step="test"; fi
          if [ "$LINT_OUTCOME" = "success" ] && [ "$TEST_OUTCOME" = "success" ]; then failed_step="build"; fi

          branch="chore/deps-update-$(date -u +%F)"
          git checkout -b "$branch"
          git add package.json bun.lock biome.json
          git commit -m "chore(deps): update all dependencies to latest"
          git push --force origin "$branch"

          body=$(printf "The daily dependency update failed at the **%s** step.\n\nFailing run: %s/%s/actions/runs/%s" \
            "$failed_step" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh pr create --base main --head "$branch" \
            --title "chore(deps): update all dependencies to latest" \
            --label dependencies \
            --body "$body"

          echo "::error::The ${failed_step} step failed after updating dependencies."
          exit 1

      - name: Detect available major updates
        run: |
          bun outdated > /tmp/outdated.txt || true
          awk -F'|' '
            NF >= 6 && $2 !~ /^[- ]*$/ && $2 !~ /Package/ {
              pkg = $2; current = $3; latest = $5
              gsub(/^ +| +$/, "", pkg); sub(/ \(dev\)$/, "", pkg)
              gsub(/ /, "", current); gsub(/ /, "", latest)
              split(current, c, "."); split(latest, l, ".")
              if (l[1] + 0 > c[1] + 0) print pkg "|" current "|" latest
            }' /tmp/outdated.txt > /tmp/majors.txt

          while IFS='|' read -r pkg current latest; do
            [ -z "$pkg" ] && continue
            title="Major update available: $pkg $current → $latest"
            existing=$(gh issue list --state open --label dependencies --json title \
              | jq --arg pkg "$pkg" '[.[] | select(.title | startswith("Major update available: " + $pkg + " "))] | length')
            if [ "$existing" -eq 0 ]; then
              body=$(printf "A new major version is available: %s %s → %s.\n\nDetected by the update-deps workflow (%s/%s/actions/runs/%s). To be applied manually." \
                "$pkg" "$current" "$latest" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
              gh issue create --title "$title" --label dependencies --body "$body"
            fi
          done < /tmp/majors.txt
